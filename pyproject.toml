[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddp-gradient-compression"
version = "0.1.0"
description = "Experimental PyTorch DDP communication hooks for gradient compression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
